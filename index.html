<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My GitHub Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background: linear-gradient(135deg,#FFD6E8,#D6F0FF);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(10px);
    width:350px;
    padding:35px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    animation:fadeIn 1s ease;
}

.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    border:5px solid #fff;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
    margin-bottom:20px;
}

h1{
    color:#ff5c8a;
    margin-bottom:15px;
}

p{
    color:#555;
    font-size:17px;
    line-height:1.8;
}

.btn{
    display:inline-block;
    margin-top:25px;
    padding:12px 30px;
    background:#ff7eb3;
    color:white;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    background:#ff4f95;
    transform:scale(1.08);
}

.icon{
    font-size:30px;
    margin-top:15px;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>

</head>
<body>

<div class="card">

    <!-- เปลี่ยนเป็นรูปของตัวเองได้ -->
    <img src="https://i.imgur.com/4Z7Q6Qb.png" class="avatar" alt="Avatar">

    <h1>🌸 ยินดีต้อนรับ 🌸</h1>

    <p>สวัสดีครับ 👋</p>

    <p><strong>ผมชื่อ อดิศร (Adisorn)</strong></p>

    <p>🎓 นักเรียนห้องเรียนพิเศษ Gifted</p>

    <p>💻 กำลังฝึกเขียนเว็บไซต์ด้วย HTML และ GitHub Pages</p>

    <div class="icon">🌷✨🌈</div>

    <a href="portfolio.html" class="btn">
        ดูผลงานของฉัน 🚀
</a>
</div>
</body>
</html>
