<!-- นี่คือโครงสร้างหน้าเว็บทั้งหมด -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หน้าแนะนำตัวของฉัน</title>
<style>
:root {
    --bg-color: #faf9f6; /* สีขาวออฟไวท์หรูหรา */
    --text-dark: #1a1a1a;
    --gold-gradient: linear-gradient(135deg, #b38728, #fbf5b7, #daa520, #fbf5b7, #aa771c);
    --gold-primary: #d4af37;
    --card-bg: rgba(255, 255, 255, 0.95);
}

body {
    background-color: var(--bg-color); 
    color: var(--text-dark);
    text-align: center; 
    padding: 50px 20px;
    font-family: 'Cinzel', 'Playfair Display', 'ChulaCharas', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow-x: hidden;
}

/* เอฟเฟกต์แสงไฟระยิบระยับเบื้องหลัง (Sparkling Lights Background) */
body::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
        radial-gradient(circle, #fff 10%, transparent 20%),
        radial-gradient(circle, rgba(255,245,183,0.8) 15%, transparent 25%),
        radial-gradient(circle, rgba(212,175,55,0.15) 20%, transparent 40%);
    background-size: 350px 350px, 450px 450px, 600px 600px;
    background-position: 0 0, 50px 150px, 200px 300px;
    animation: sparkle 15s linear infinite;
    opacity: 0.7;
    z-index: 1;
    pointer-events: none;
}

@keyframes sparkle {
    0% { background-position: 0 0, 50px 150px, 200px 300px; }
    100% { background-position: 350px 350px, 500px 600px, 800px 900px; }
}

/* แสงแฟลชสปอตไลท์ส่องสว่างตรงกลาง */
.spotlight {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at center, rgba(255,255,255,0.9) 0%, rgba(250,249,246,0) 70%);
    z-index: 2;
    pointer-events: none;
}

.card {
    background: var(--card-bg); 
    border-radius: 15px;
    box-shadow: 0 15px 35px rgba(212, 175, 55, 0.15);
    max-width: 550px; 
    margin: 0 auto; 
    padding: 40px 30px;
    border: 1px solid rgba(212, 175, 55, 0.25);
    position: relative;
    z-index: 10;
    backdrop-filter: blur(5px);
    transition: transform 0.3s ease;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 45px rgba(212, 175, 55, 0.25);
}

/* สัญลักษณ์มงกุฎประกายดาว */
.crown-logo {
    font-size: 2.5rem;
    color: var(--gold-primary);
    margin-bottom: 10px;
    display: inline-block;
    animation: pulse 2.5s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(212,175,55,0.4)); }
    50% { transform: scale(1.05); filter: drop-shadow(0 0 15px rgba(212,175,55,0.7)); }
    100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(212,175,55,0.4)); }
}

h1 { 
    background: var(--gold-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
    font-size: 1.8rem;
    letter-spacing: 1px;
    margin-bottom: 25px;
    font-weight: 700;
}

p { 
    font-size: 18px; 
    line-height: 1.8; 
    color: #444;
    margin: 12px 0;
}

p strong {
    color: #aa771c;
    font-size: 1.15rem;
    letter-spacing: 0.5px;
}

/* ปุ่มกดสไตล์ Grand Entrance มีแสงวิ่งผ่าน */
.btn {
    display: inline-block;
    margin-top: 30px;
    padding: 12px 40px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-decoration: none;
    color: white;
    background: linear-gradient(135deg, #b38728, #daa520, #aa771c);
    border: none;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(212, 175, 55, 0.35);
    overflow: hidden;
    position: relative;
    transition: all 0.3s ease;
}

.btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.6),
        transparent
    );
    animation: shimmer 3s infinite;
}

@keyframes shimmer {
    0% { left: -100%; }
    30% { left: 100%; }
    100% { left: 100%; }
}

.btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(212, 175, 55, 0.5);
    letter-spacing: 3px;
}
</style>
<link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

<div class="spotlight"></div>

<div class="card">
<div class="crown-logo">✦ 👑 ✦</div>
<h1>ยินดีต้อนรับสู่โปรไฟล์ของฉัน</h1>
<p>สวัสดีค่ะ! ฉันชื่อ <strong>อดิศร (Adisorn)</strong></p>
<p>ขณะนี้กำลังศึกษาอยู่ห้องเรียนพิเศษ <strong>Gifted</strong></p>
<p>นี่คือเว็บไซต์แรกของฉันที่โฮสต์บน GitHub Pages!</p>
  <!-- ดูผลงาน -->
<a href="portfolio.html" class="btn">หน้าถัดไป</a>
</div>

</body>
</html>
