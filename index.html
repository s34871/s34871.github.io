<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the Universe</title>
    <style>
        :root {
            --bg-color: #faf9f6;
            --text-dark: #1a1a1a;
            --gold-gradient: linear-gradient(135deg, #b38728, #fbf5b7, #daa520, #fbf5b7, #aa771c);
            --gold-primary: #d4af37;
        }

        body {
            font-family: 'Cinzel', 'Playfair Display', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* เอฟเฟกต์แสงไฟระยิบระยับเต็มจอ (Sparkling Spotlight Background) */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle, #fff 10%, transparent 20%),
                radial-gradient(circle, rgba(255,245,183,0.9) 15%, transparent 25%),
                radial-gradient(circle, rgba(212,175,55,0.2) 20%, transparent 40%);
            background-size: 350px 350px, 450px 450px, 600px 600px;
            background-position: 0 0, 50px 150px, 200px 300px;
            animation: sparkle 15s linear infinite;
            opacity: 0.6;
            z-index: 1;
            pointer-events: none;
        }

        /* แสงแฟลช/แสงสปอตไลท์ตรงกลางหน้าจอ */
        .spotlight {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(255,255,255,0.8) 0%, rgba(250,249,246,0) 70%);
            z-index: 2;
            pointer-events: none;
        }

        @keyframes sparkle {
            0% { background-position: 0 0, 50px 150px, 200px 300px; }
            100% { background-position: 350px 350px, 500px 600px, 800px 900px; }
        }

        .welcome-container {
            text-align: center;
            z-index: 10;
            padding: 2rem;
            max-width: 600px;
            animation: fadeIn 2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* โลโก้หรือสัญลักษณ์มงกุฎจำลอง */
        .crown-icon {
            font-size: 3rem;
            color: var(--gold-primary);
            margin-bottom: 1rem;
            display: inline-block;
            animation: pulse 2.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(212,175,55,0.4)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 20px rgba(212,175,55,0.8)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(212,175,55,0.4)); }
        }

        h1 {
            font-size: 3rem;
            letter-spacing: 4px;
            margin: 0 0 1rem 0;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            font-weight: 700;
        }

        p {
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #555;
            margin-bottom: 3rem;
            font-weight: 300;
        }

        /* ปุ่มกด Grand Entrance พร้อมเอฟเฟกต์ Shimmer แสงพาดผ่าน */
        .enter-btn {
            position: relative;
            display: inline-block;
            padding: 1.2rem 3.5rem;
            font-family: 'Cinzel', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg, #b38728, #daa520, #aa771c);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* ตัวสร้างแสงวิ่งวาบพาดผ่านปุ่ม */
        .enter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.6),
                transparent
            );
            transition: none;
        }

        /* อนิเมชันแสงวิ่งเมื่อโหลดหน้าเว็บและวนลูปซ้ำ */
        .enter-btn::before {
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            30% { left: 100%; }
            100% { left: 100%; }
        }

        .enter-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.6);
            letter-spacing: 4px;
        }

        .enter-btn:active {
            transform: translateY(-1px);
        }
    </style>
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <div class="spotlight"></div>

    <div class="welcome-container">
        <div class="crown-icon">✦ 👑 ✦</div>
        <h1>The Universe</h1>
        <p>Is Calling You</p>
        
        <!-- ลิงก์ไปยังหน้าพอร์ตโฟลิโอของคุณ (เปลี่ยนชื่อไฟล์ตามที่คุณตั้งไว้ได้เลยครับ) -->
        <a href="index.html" class="enter-btn">Grand Entrance</a>
    </div>

</body>
</html>
