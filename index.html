<!-- นี่คือโครงสร้างหน้าเว็บทั้งหมด -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หน้าแนะนำตัวของฉัน</title>
<style>
:root {
    --bg-color: #faf9f6; /* สีขาวออฟไวท์หรูหรา */
    --text-dark: #1a1a1a;
    --gold-gradient: linear-gradient(135deg, #b38728, #fbf5b7, #daa520, #fbf5b7, #aa771c);
    --gold-primary: #d4af37;
    --card-bg: rgba(255, 255, 255, 0.96);
}

body {
    background-color: var(--bg-color); 
    color: var(--text-dark);
    text-align: center; 
    padding: 50px 20px;
    font-family: 'Cinzel', 'Playfair Display', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow-x: hidden;
}

/* เอฟเฟกต์ลายเพชรบนชุดราตรีและแสงไฟระยิบระยับ (Crystal Gown & Sparkle Background) */
body::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* ผสมผสานลายเส้นตาข่ายรูปเพชร (Diamond Grid) และจุดประกายแสงไฟ */
    background: 
        radial-gradient(circle, #fff 10%, transparent 20%) 0 0 / 350px 350px,
        radial-gradient(circle, rgba(255,245,183,0.8) 15%, transparent 25%) 50px 150px / 450px 450px,
        linear-gradient(115deg, rgba(212,175,55,0.04) 25%, transparent 25%) 0 0 / 40px 70px,
        linear-gradient(245deg, rgba(212,175,55,0.04) 25%, transparent 25%) 0 0 / 40px 70px,
        linear-gradient(115deg, rgba(212,175,55,0.04) 25%, transparent 25%) 20px 35px / 40px 70px,
        linear-gradient(245deg, rgba(212,175,55,0.04) 25%, transparent 25%) 20px 35px / 40px 70px;
    animation: sparkle 20s linear infinite;
    opacity: 0.85;
    z-index: 1;
    pointer-events: none;
}

@keyframes sparkle {
    0% { background-position: 0 0, 50px 150px, 0 0, 0 0, 20px 35px, 20px 35px; }
    100% { background-position: 350px 350px, 500px 600px, 40px 70px, 40px 70px, 60px 105px, 60px 105px; }
}

/* แสงแฟลชสปอตไลท์ส่องสว่างตรงกลาง */
.spotlight {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at center, rgba(255,255,255,0.95) 0%, rgba(250,249,246,0) 75%);
    z-index: 2;
    pointer-events: none;
}

.card {
    background: var(--card-bg); 
    border-radius: 20px; /* เพิ่มความโค้งมนให้กล่องข้อความหลัก */
    box-shadow: 0 20px 50px rgba(212, 175, 55, 0.18);
    max-width: 550px; 
    margin: 0 auto; 
    padding: 50px 40px;
    border: 1px solid rgba(212, 175, 55, 0.3);
    position: relative;
    z-index: 10;
    backdrop-filter: blur(8px);
    transition: all 0.3s ease;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 25px 60px rgba(212, 175, 55, 0.28);
    border-color: rgba(212, 175, 55, 0.5);
}

/* สัญลักษณ์มงกุฎประกายดาว */
.crown-logo {
    font-size: 2.8rem;
    color: var(--gold-primary);
    margin-bottom: 15px;
    display: inline-block;
    animation: pulse 2.5s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(212,175,55,0.4)); }
    50% { transform: scale(1.05); filter: drop-shadow(0 0 20px rgba(212,175,55,0.8)); }
    100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(212,175,55,0.4)); }
}

h1 { 
    background: var(--gold-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
    font-size: 1.9rem;
    letter-spacing: 1px;
    margin-bottom: 30px;
    font-weight: 700;
}

p { 
    font-size: 18px; 
    line-height: 1.8; 
    color: #333;
    margin: 15px 0;
}

p strong {
    color: #aa771c;
    font-size: 1.2rem;
    letter-spacing: 0.5px;
}

/* ปุ่มกดทรงกลมมนสไตล์โอต์กูตูร์ (Round Shimmer Button) */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px; /* ระยะห่างระหว่างข้อความและลูกศร */
    margin-top: 35px;
    padding: 14px 45px;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-decoration: none;
    color: white;
    background: linear-gradient(135deg, #b38728, #daa520, #aa771c);
    border: none;
    border-radius: 50px; /* ปรับให้เป็นทรงกลมมนแบบแคปซูล */
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
    overflow: hidden;
    position: relative;
    transition: all 0.3s ease;
}

/* ลูกศรขยับได้ */
.btn .arrow {
    display: inline-block;
    transition: transform 0.3s ease;
}

/* เอฟเฟกต์แสงวิ่งพาดผ่านปุ่ม */
.btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.6),
        transparent
    );
    animation: shimmer 3s infinite;
}

@keyframes shimmer {
    0% { left: -100%; }
    30% { left: 100%; }
    100% { left: 100%; }
}

.btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 35px rgba(212, 175, 55, 0.55);
    letter-spacing: 3px;
}

/* เมื่อเอาเมาส์ชี้ ปุ่มลูกศรจะพุ่งไปข้างหน้าสั้นๆ */
.btn:hover .arrow {
    transform: translateX(5px);
}
</style>
<link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

<div class="spotlight"></div>

<div class="card">
<div class="crown-logo">✦ 👑 ✦</div>
<h1>ยินดีต้อนรับสู่โปรไฟล์ของฉัน</h1>
<p>สวัสดีค่ะ ฉันชื่อ <strong>อดิศร (Adisorn)</strong></p>
<p>ขณะนี้กำลังศึกษาอยู่ห้องเรียนพิเศษ <strong>Gifted</strong></p>
<p>นี่คือเว็บไซต์แรกของฉันที่โฮสต์บน GitHub Pages!</p>
  <!-- ดูผลงาน -->
<a href="portfolio.html" class="btn">หน้าถัดไป <span class="arrow">⟶</span></a>
</div>

</body>
</html>
