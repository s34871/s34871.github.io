<!-- นี่คือโครงสร้างหน้าเว็บทั้งหมด -->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแนะนำตัวของฉัน ✨</title>
    <style>
        /* ตั้งค่าพื้นหลังและฟอนต์ให้ดูนุ่มฟู */
        body {
            background-color: #FFEAEF; 
            color: #5D536A;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden; /* ป้องกันไม่ให้ประกายวิ้งทะลุหน้าจอ */
        }

        /* --- ส่วนของแสงวิ้งๆ ระยิบระยับ (Background Sparkles) --- */
        .sparkles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none; /* ทำให้คลิกทะลุได้ */
        }

        .sparkle {
            position: absolute;
            font-size: 24px;
            user-select: none;
            animation: twinkleSparkle 2.5s infinite ease-in-out;
            opacity: 0;
        }

        /* กำหนดขนาดและตำแหน่งของวิ้งๆ แต่ละจุด */
        .sparkle:nth-child(1) { top: 12%; left: 8%; font-size: 20px; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 20%; left: 85%; font-size: 28px; animation-delay: 0.6s; }
        .sparkle:nth-child(3) { top: 75%; left: 12%; font-size: 24px; animation-delay: 1.2s; }
        .sparkle:nth-child(4) { top: 82%; left: 80%; font-size: 22px; animation-delay: 1.8s; }
        .sparkle:nth-child(5) { top: 38%; left: 18%; font-size: 26px; animation-delay: 0.3s; }
        .sparkle:nth-child(6) { top: 62%; left: 88%; font-size: 18px; animation-delay: 1.5s; }
        .sparkle:nth-child(7) { top: 8%; left: 52%; font-size: 25px; animation-delay: 0.9s; }
        .sparkle:nth-child(8) { top: 88%; left: 45%; font-size: 20px; animation-delay: 2.1s; }

        /* แอนิเมชันการขยาย โต โต ละมุน และหมุนเล็กน้อย */
        @keyframes twinkleSparkle {
            0%, 100% { 
                transform: scale(0) rotate(0deg); 
                opacity: 0; 
                filter: drop-shadow(0 0 0px rgba(255,255,255,0));
            }
            50% { 
                transform: scale(1.2) rotate(15deg); 
                opacity: 0.9; 
                filter: drop-shadow(0 0 8px rgba(255, 223, 128, 0.8));
            }
        }

        /* --- ปรับแต่งการ์ดและเนื้อหา --- */
        .card {
            background: rgba(255, 255, 255, 0.85); /* ปรับให้เห็นวิ้งๆ ด้านหลังลางๆ */
            backdrop-filter: blur(8px); /* เอฟเฟกต์กระจกฝ้านุ่มๆ */
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(255, 182, 185, 0.4);
            max-width: 480px; 
            width: 100%;
            padding: 40px 30px;
            text-align: center;
            border: 3px solid #FFCAD4;
            transition: transform 0.3s ease;
            position: relative;
            z-index: 1; /* ให้การ์ดอยู่เหนือประกายวิ้ง */
        }

        .card:hover {
            transform: translateY(-5px);
        }

        h1 { 
            color: #98719E; 
            font-size: 26px;
            margin-bottom: 25px;
        }

        p { 
            font-size: 16px; 
            line-height: 1.8;
            margin: 12px 0;
        }

        strong {
            color: #FF7B94;
            background: #FFEAEF;
            padding: 2px 8px;
            border-radius: 8px;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 35px;
            background: linear-gradient(135deg, #FFB6B9, #FFCAD4);
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(255, 182, 185, 0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: linear-gradient(135deg, #FF7B94, #FFB6B9);
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 114, 140, 0.4);
        }
    </style>
</head>
<body>

<!-- โครงสร้างแสงวิ้งๆ ✨ -->
<div class="sparkles">
    <div class="sparkle">✨</div>
    <div class="sparkle">✨</div>
    <div class="sparkle">✨</div>
    <div class="sparkle">✨</div>
    <div class="sparkle">✨</div>
    <div class="sparkle">✨</div>
    <div class="sparkle">✨</div>
    <div class="sparkle">✨</div>
</div>

<div class="card">
    <h1>ยินดีต้อนรับสู่โปรไฟล์ของฉัน 👋✨</h1>
    <p>สวัสดีค่ะ! ฉันชื่อ <strong>อดิศร (Adisorn)</strong></p>
    <p>กำลังศึกษาอยู่ห้องเรียนพิเศษ <strong>Gifted</strong></p>
    <p>นี่คือเว็บไซต์แรกของฉันที่โฮสต์บน GitHub Pages! 🚀</p>
    
    <!-- ดูผลงาน -->
    <a href="portfolio.html" class="btn">หน้าถัดไป ✨</a>
</div>

</body>
</html>
