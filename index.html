<!-- นี่คือโครงสร้างหน้าเว็บทั้งหมด -->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแนะนำตัวของฉัน ✨</title>
    <style>
        /* ตั้งค่าพื้นหลังและฟอนต์ให้ดูนุ่มฟู */
        body {
            background-color: #FFEAEF; 
            color: #5D536A;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* ปรับแต่งการ์ดให้น่ารัก ละมุนตา */
        .card {
            background: #FFFFFF; 
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(255, 182, 185, 0.4);
            max-width: 480px; 
            width: 100%;
            padding: 40px 30px;
            text-align: center;
            border: 3px solid #FFCAD4;
            transition: transform 0.3s ease;
        }

        /* เอฟเฟกต์เวลาเอาเมาส์ไปวางบนการ์ด */
        .card:hover {
            transform: translateY(-5px);
        }

        /* หัวข้อหลัก */
        h1 { 
            color: #98719E; 
            font-size: 26px;
            margin-bottom: 25px;
        }

        /* ข้อความทั่วไป */
        p { 
            font-size: 16px; 
            line-height: 1.8;
            margin: 12px 0;
        }

        /* ไฮไลต์ข้อความสำคัญ */
        strong {
            color: #FF7B94;
            background: #FFEAEF;
            padding: 2px 8px;
            border-radius: 8px;
        }

        /* ตกแต่งปุ่ม "หน้าถัดไป" ให้น่ารักน่ากด */
        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 35px;
            background: linear-gradient(135deg, #FFB6B9, #FFCAD4);
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(255, 182, 185, 0.4);
            transition: all 0.3s ease;
        }

        /* เอฟเฟกต์เวลาเอาเมาส์ไปวางบนปุ่ม */
        .btn:hover {
            background: linear-gradient(135deg, #FF7B94, #FFB6B9);
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 114, 140, 0.4);
        }
    </style>
</head>
<body>

<div class="card">
    <h1>ยินดีต้อนรับสู่โปรไฟล์ของฉัน 👋✨</h1>
    <p>สวัสดีค่ะ! ฉันชื่อ <strong>อดิศร (Adisorn)</strong></p>
    <p>กำลังศึกษาอยู่ห้องเรียนพิเศษ 🎀 <strong>Gifted</strong></p>
    <p>นี่คือเว็บไซต์แรกของฉันที่โฮสต์บน GitHub Pages! 🚀</p>
    
    <!-- ดูผลงาน -->
    <a href="portfolio.html" class="btn">หน้าถัดไป ✨</a>
</div>

</body>
</html>
