<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติส่วนตัว - อดิศร</title>
    <style>
        :root { --bg-color: #faf9f6; --text-dark: #1a1a1a; --gold-primary: #d4af37; --gold-gradient: linear-gradient(135deg, #b38728, #fbf5b7, #daa520, #fbf5b7, #aa771c); --card-bg: rgba(255, 255, 255, 0.96); --border-gold: 1px solid rgba(212, 175, 55, 0.35); }
        body { background-color: var(--bg-color); color: var(--text-dark); text-align: center; padding: 120px 20px 50px 20px; font-family: 'Cinzel', 'Playfair Display', sans-serif; margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; position: relative; overflow-x: hidden; }

        .navbar { position: fixed; top: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.92); border-bottom: 1px solid rgba(212, 175, 55, 0.3); backdrop-filter: blur(10px); z-index: 1000; display: flex; justify-content: center; gap: 15px; padding: 15px 0; box-shadow: 0 5px 20px rgba(0,0,0,0.03); }
        .nav-link { color: #aa771c; text-decoration: none; font-weight: 700; font-size: 0.95rem; padding: 8px 16px; border-radius: 30px; transition: all 0.3s ease; }
        .nav-link:hover, .nav-link.active { background: var(--gold-gradient); color: white; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); }

        /* ✦ แสงทองโปรยลงมา ✦ */
        .gold-light-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }
        .light-ray {
            position: absolute;
            top: -20%;
            width: 140px;
            height: 160%;
            background: linear-gradient(180deg, rgba(212,175,55,0) 0%, rgba(251,245,183,0.35) 45%, rgba(212,175,55,0.12) 70%, rgba(212,175,55,0) 100%);
            transform: rotate(18deg);
            animation: rayDrift 9s ease-in-out infinite;
            filter: blur(2px);
        }
        .light-ray:nth-child(1) { left: 8%;  animation-delay: 0s;   opacity: 0.6; }
        .light-ray:nth-child(2) { left: 32%; animation-delay: 1.4s; opacity: 0.4; width: 100px; }
        .light-ray:nth-child(3) { left: 58%; animation-delay: 2.8s; opacity: 0.55; }
        .light-ray:nth-child(4) { left: 80%; animation-delay: 4.2s; opacity: 0.35; width: 90px; }

        @keyframes rayDrift {
            0%   { transform: translateY(-6%) rotate(18deg); opacity: 0; }
            15%  { opacity: 0.7; }
            50%  { transform: translateY(4%) rotate(18deg); }
            85%  { opacity: 0.5; }
            100% { transform: translateY(14%) rotate(18deg); opacity: 0; }
        }

        .sparkle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: var(--gold-primary);
            border-radius: 50%;
            box-shadow: 0 0 8px 2px rgba(212,175,55,0.7);
            animation: sparkleFall linear infinite;
        }
        @keyframes sparkleFall {
            0%   { transform: translateY(-40px) scale(0.6); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 0.8; }
            100% { transform: translateY(900px) scale(1); opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .light-ray, .sparkle { animation: none !important; }
        }

        .card { background: var(--card-bg); border-radius: 20px; box-shadow: 0 20px 50px rgba(212, 175, 55, 0.18); width: 100%; max-width: 900px; margin: 0 auto; padding: 55px 70px; border: var(--border-gold); position: relative; z-index: 10; }
        h1 { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.9rem; font-weight: 700; margin-bottom: 25px; }
        p { font-size: 18px; line-height: 1.8; color: #333; margin: 15px 0; text-align: left; }

        @media (max-width: 600px) {
            .card { padding: 35px 22px; }
        }
    </style>
</head>
<body>
    <div class="gold-light-layer" aria-hidden="true">
        <div class="light-ray"></div>
        <div class="light-ray"></div>
        <div class="light-ray"></div>
        <div class="light-ray"></div>
        <div class="sparkle" style="left:12%; animation-duration:6s; animation-delay:0s;"></div>
        <div class="sparkle" style="left:24%; animation-duration:7.5s; animation-delay:1.2s;"></div>
        <div class="sparkle" style="left:38%; animation-duration:5.5s; animation-delay:2.1s;"></div>
        <div class="sparkle" style="left:50%; animation-duration:8s; animation-delay:0.6s;"></div>
        <div class="sparkle" style="left:63%; animation-duration:6.8s; animation-delay:3s;"></div>
        <div class="sparkle" style="left:76%; animation-duration:7.2s; animation-delay:1.8s;"></div>
        <div class="sparkle" style="left:88%; animation-duration:5.8s; animation-delay:2.6s;"></div>
    </div>
    <nav class="navbar">
        <a href="index.html" class="nav-link">🏠 หน้าแรก</a>
        <a href="about.html" class="nav-link active">👑 ประวัติส่วนตัว</a>
        <a href="education.html" class="nav-link">🎓 ประวัติการศึกษา</a>
        <a href="activities.html" class="nav-link">✨ ผลงาน</a>
        <a href="future.html" class="nav-link">✦ ศึกษาต่อ</a>
    </nav>
    <div class="card">
        <h1>👑 ประวัติส่วนตัว</h1>
        <p>• <strong>ชื่อ-นามสกุล:</strong> อดิศร ทวีโชคสิริกุล </p>
        <p>• <strong>ชื่อเล่น:</strong> คิว </p>
        <p>• <strong>วัน เดือน ปี เกิด:</strong> 12 กันยายน 2552 </p>
    </div>
</body>
</html>
