<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติส่วนตัว - อดิศร</title>
    <style>
        :root { --bg-color: #faf9f6; --text-dark: #1a1a1a; --gold-primary: #d4af37; --gold-gradient: linear-gradient(135deg, #b38728, #fbf5b7, #daa520, #fbf5b7, #aa771c); --card-bg: rgba(255, 255, 255, 0.96); --border-gold: 1px solid rgba(212, 175, 55, 0.35); }
        body { background-color: var(--bg-color); color: var(--text-dark); text-align: center; padding: 120px 20px 50px 20px; font-family: 'Cinzel', 'Playfair Display', sans-serif; margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; position: relative; overflow-x: hidden; }
        body::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #fff 15%, transparent 25%) 0 0 / 350px 350px, linear-gradient(115deg, rgba(212,175,55,0.12) 25%, transparent 25%) 0 0 / 40px 70px, linear-gradient(245deg, rgba(212,175,55,0.12) 25%, transparent 25%) 0 0 / 40px 70px; animation: bgMove 25s linear infinite; opacity: 0.95; z-index: 1; pointer-events: none; }
        @keyframes bgMove { 0% { background-position: 0 0, 0 0, 0 0; } 100% { background-position: 350px 350px, 40px 70px, 40px 70px; } }
        
        .navbar { position: fixed; top: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.92); border-bottom: 1px solid rgba(212, 175, 55, 0.3); backdrop-filter: blur(10px); z-index: 1000; display: flex; justify-content: center; gap: 15px; padding: 15px 0; box-shadow: 0 5px 20px rgba(0,0,0,0.03); }
        .nav-link { color: #aa771c; text-decoration: none; font-weight: 700; font-size: 0.95rem; padding: 8px 16px; border-radius: 30px; transition: all 0.3s ease; }
        .nav-link:hover, .nav-link.active { background: var(--gold-gradient); color: white; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); }

        .card { background: var(--card-bg); border-radius: 20px; box-shadow: 0 20px 50px rgba(212, 175, 55, 0.18); max-width: 550px; margin: 0 auto; padding: 50px 40px; border: var(--border-gold); position: relative; z-index: 10; backdrop-filter: blur(8px); }
        h1 { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.9rem; font-weight: 700; margin-bottom: 25px; }
        p { font-size: 18px; line-height: 1.8; color: #333; margin: 15px 0; text-align: left; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-link">🏠 หน้าแรก</a>
        <a href="about.html" class="nav-link active">👑 ประวัติส่วนตัว</a>
        <a href="education.html" class="nav-link">🎓 ประวัติการศึกษา</a>
        <a href="activities.html" class="nav-link">✨ ผลงาน</a>
        <a href="future.html" class="nav-link">✦ ศึกษาต่อ</a>
    </nav>
    <div class="card">
        <h1>👑 ประวัติส่วนตัว</h1>
        <p>• <strong>ชื่อ-นามสกุล:</strong> อดิศร ทวีโชคสิริกุล </p>
        <p>• <strong>ชื่อเล่น:</strong> คิว </p>
        <p>• <strong>ความสามารถพิเศษ:</strong> การเต้น </p>
        <p>• <strong>คติพจน์:</strong> "ความมุ่งมั่นพัฒนาตนเองคือจุดเริ่มต้นของความสำเร็จ"</p>
    </div>
</body>
</html>
